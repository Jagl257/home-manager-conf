# Starship prompt configuration template

# Use the color palette
palette = "dracula"

# Define Dracula color palette
[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"

add_newline = false

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 3

[git_branch]

[nodejs]
format = "via [⬢ $version](bold green) "

[python]
format = "via [🐍 $version]($style) [$virtualenv]($style) "
detect_extensions = ["py"]
style = "bold blue"

[nix_shell]
format = "via [$symbol$state( $name)]($style) "
symbol = "❄️ "
style = "bold blue"

[aws]
format = "on [$symbol $profile]($style) "
symbol = "☁️ "
style = "bold yellow"
disabled = false

[azure]
format = "on [$symbol $subscription]($style) "
symbol = "☁️ "
style = "bold blue"
disabled = false
